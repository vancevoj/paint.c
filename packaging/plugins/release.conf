# The GitHub release that carries the optional plugin downloads
# (packaging/plugins/build-plugins.sh, plugin_meta.py, docs/PLUGINS.md).
# Read by sh (". release.conf") and by plugin_meta.py: name=value lines only.
#   version      plugin set release; the tag is plugins-v<version>, the bundle
#                is paintc-plugins-all-<version>-<platform>.zip, and a plugin
#                whose README card has no version: line gets this version
#                (the release page link in the text of README.md and
#                docs/PLUGINS.md names the tag too: update it with a bump)
#   repo         GitHub owner/name the download links point at
#   glibc_floor  newest GLIBC_ symbol version a Linux plugin may need (OD-4)
version=1.0.0
repo=vancevoj/paint.c
glibc_floor=2.31
