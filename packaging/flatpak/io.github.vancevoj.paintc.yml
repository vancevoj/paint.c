# Flatpak manifest of paint.c for local builds from this checkout. The
# Flathub manifest (github.com/flathub/io.github.vancevoj.paintc) is the same
# with a git source pinned to a release tag instead of the dir source.
# Build and install for the user:
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#       build-flatpak packaging/flatpak/io.github.vancevoj.paintc.yml
# The build has no network: every dependency archive of cmake/PcDeps.cmake
# and cmake/PcCodecDeps.cmake is listed below (same URLs and SHA-256) and
# handed to CMake through PC_DOWNLOAD_CACHE. Keep both lists in sync when a
# dependency is updated (docs/PACKAGING.md). SDL3 (3.4 in runtime 26.08, which
# ADR-022 accepts), libavif and libjxl come from the runtime.
app-id: io.github.vancevoj.paintc
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: paintc
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Images elsewhere go through the file chooser portal, whose documents
  # stay readable after a restart (recent files keep working); the
  # Pictures folder is open directly so its files keep their real paths.
  - --filesystem=xdg-pictures
  # image tab menu > Open Containing Folder (FileManager1.ShowItems)
  - --talk-name=org.freedesktop.FileManager1
modules:
  - name: paintc
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DPC_VENDOR_SDL=OFF
      - -DPC_BUILD_TESTS=OFF
      # a newer compiler in a runtime update must not fail the build
      - -DPC_WERROR=OFF
      # the optional plugins are separate downloads (plugins/README.md)
      - -DPC_BUILD_PLUGINS=OFF
      - -DPC_DOWNLOAD_CACHE=/run/build/paintc/deps
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - build-san
          - build-clang
          - build-full
          - build-flatpak
          - .flatpak-builder
      - type: file
        url: https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
        sha256: bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16
        dest: deps
      - type: file
        url: https://github.com/randy408/libspng/archive/refs/tags/v0.7.4.tar.gz
        sha256: 47ec02be6c0a6323044600a9221b049f63e1953faf816903e7383d4dc4234487
        dest: deps
      - type: file
        url: https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-3.2.0.tar.gz
        sha256: 6f30092cef9fb839779646608f4ee14ae3cbac989c47fa05e841b0841f09878e
        dest: deps
      - type: file
        url: https://github.com/webmproject/libwebp/archive/refs/tags/v1.6.0.tar.gz
        sha256: 93a852c2b3efafee3723efd4636de855b46f9fe1efddd607e1f42f60fc8f2136
        dest: deps
      - type: file
        url: https://github.com/mm2/Little-CMS/releases/download/lcms2.19.1/lcms2-2.19.1.tar.gz
        sha256: bfc54f7bab59fbc921012014a8032e4cba4abd46db47d46b76416a8c0b2815c8
        dest: deps
