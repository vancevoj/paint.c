# paint.c continuous integration (lane L0). Every job configures with CMake
# and Ninja, builds Release (or the sanitizer flavour) and runs CTest, which
# runs every test executable with --quick.
#
# SDL3 3.4.18 is built from source everywhere (PC_VENDOR_SDL=ON) so every
# platform tests the same pinned version; Ubuntu 24.04 has no SDL3 package
# anyway. Dependency archives are cached through PC_DOWNLOAD_CACHE.
#
# AVIF and JPEG XL (lane AVIFJXL, docs/codecs/avif_jxl.md): the jobs that
# build release packages use the pinned static BUNDLED build (self-contained
# packages): linux-gcc, mingw-w64, windows-cl and, on tags, both macOS jobs.
# linux-clang and the sanitizer job use Ubuntu's libavif-dev and libjxl-dev
# (the oldest supported versions, 1.0.4 and 0.7.0), macos-14 Homebrew's
# libavif and jpeg-xl (AUTO, except on tags). macos-15-intel builds with
# AUTO and what the image has (libavif 1.4.2 is preinstalled there, libjxl
# is not, so JPEG XL reports disabled); windows-clang-cl with AUTO and no
# libraries (both report disabled, like the headless step with OFF); the
# bundled libavif cannot be built with clang-cl. The mingw-w64 job checks that a
# cross build ignores the build machine's libraries (AUTO reports them
# disabled). macOS bills ten times Linux, so its bundled build runs on tags.
#
# Packages (lane I, docs/PACKAGING.md): the Linux GCC job builds the
# AppImage and a tar.gz, the Windows MSVC job the portable zip and the NSIS
# installer, the macOS jobs a .dmg each; they are uploaded as artifacts
# named pkg-*. release.yml calls this workflow on v* tags and attaches them
# to a GitHub release.
name: ci

on:
  push:
    branches: [master, main, 'ci/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every ctest call has --timeout 600: no test needs more than about 80 s on
# any runner, and a hung test must not hold a runner (macOS bills ten times
# Linux) until the job limit.
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_OUTPUT_ON_FAILURE: 1
  PC_DEPS: ${{ github.workspace }}/.deps-cache
  # Ubuntu packages for building SDL3 from source with its default X11 and
  # Wayland options (the list in docs/BUILDING.md). Every Linux job uses this
  # one list: vendored SDL3 fails to configure when an enabled backend such
  # as XScreenSaver (libxss-dev) has no development package.
  SDL3_APT_DEPS: >-
    ninja-build pkg-config
    libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
    libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols
    libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev
    libgbm-dev libdbus-1-dev libibus-1.0-dev libudev-dev libasound2-dev
    libpulse-dev libpipewire-0.3-dev

jobs:
  linux:
    name: linux-${{ matrix.cc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $SDL3_APT_DEPS
      - name: AVIF and JPEG XL dependencies (lane AVIFJXL)
        run: >
          sudo apt-get install -y --no-install-recommends
          ${{ matrix.cc == 'gcc' && 'nasm g++' || 'libavif-dev libjxl-dev' }}
      - uses: actions/cache@v4
        with:
          path: .deps-cache
          key: deps-${{ hashFiles('cmake/*.cmake') }}
          restore-keys: deps-
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DPC_VENDOR_SDL=ON -DPC_DOWNLOAD_CACHE="$PC_DEPS"
          -DPC_WITH_AVIF=${{ matrix.cc == 'gcc' && 'BUNDLED' || 'ON' }}
          -DPC_WITH_JXL=${{ matrix.cc == 'gcc' && 'BUNDLED' || 'ON' }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --timeout 600
      - name: Headless libraries (no SDL)
        if: matrix.cc == 'gcc'
        run: |
          cmake -S . -B build-hl -G Ninja -DCMAKE_BUILD_TYPE=Release -DPC_HEADLESS=ON \
            -DPC_DOWNLOAD_CACHE="$PC_DEPS" -DPC_WITH_AVIF=OFF -DPC_WITH_JXL=OFF
          cmake --build build-hl
          ctest --test-dir build-hl --timeout 600
      - name: Upload paintc
        if: hashFiles('src/app/CMakeLists.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: paintc-linux-${{ matrix.cc }}
          path: |
            build/paintc
            build/**/paintc
          if-no-files-found: warn
      - name: Validate the desktop entry and the AppStream metadata
        if: matrix.cc == 'gcc'
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          desktop-file-validate packaging/linux/org.paintc.paintc.desktop
          # the only finding left is the missing homepage URL (no site yet)
          appstreamcli validate --no-net packaging/linux/org.paintc.paintc.metainfo.xml || true
      - name: Package (AppImage, tar.gz)
        if: matrix.cc == 'gcc'
        run: |
          (cd build && cpack -B "$GITHUB_WORKSPACE/dist")
          PC_DOWNLOAD_CACHE="$PC_DEPS" packaging/linux/build-appimage.sh build dist
          APPIMAGE_EXTRACT_AND_RUN=1 SDL_VIDEO_DRIVER=dummy dist/*.AppImage --self-test --headless
      - name: Upload packages
        if: matrix.cc == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  linux-sanitizers:
    name: linux-asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $SDL3_APT_DEPS
      - uses: actions/cache@v4
        with:
          path: .deps-cache
          key: deps-${{ hashFiles('cmake/*.cmake') }}
          restore-keys: deps-
      - name: AVIF and JPEG XL system libraries (lane AVIFJXL)
        run: sudo apt-get install -y --no-install-recommends libavif-dev libjxl-dev
      - name: Configure
        env:
          CC: clang
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPC_SANITIZE=ON
          -DPC_VENDOR_SDL=ON -DPC_DOWNLOAD_CACHE="$PC_DEPS"
          -DPC_WITH_AVIF=ON -DPC_WITH_JXL=ON
      - name: Build
        run: cmake --build build
      - name: Test (quick, leak detection on)
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --timeout 600

  linux-tsan:
    name: linux-tsan (pal, core)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $SDL3_APT_DEPS
      - name: Allow TSan shadow mappings (high ASLR entropy breaks TSan)
        run: sudo sysctl vm.mmap_rnd_bits=28
      - uses: actions/cache@v4
        with:
          path: .deps-cache
          key: deps-${{ hashFiles('cmake/*.cmake') }}
          restore-keys: deps-
      - name: Configure
        env:
          CC: clang
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPC_TSAN=ON
          -DPC_VENDOR_SDL=ON -DPC_DOWNLOAD_CACHE="$PC_DEPS"
      - name: Build
        run: cmake --build build
      - name: Test pal and core
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          ctest --test-dir build/tests/pal --timeout 600
          ctest --test-dir build/tests/core --timeout 600

  windows-cross:
    name: mingw-w64 + wine
    runs-on: ubuntu-24.04
    # Debian 13 matches the reference toolchain: mingw-w64 GCC 14 (UCRT via
    # -mcrtdll) and Wine 10.
    container: debian:trixie
    defaults:
      run:
        shell: bash
    env:
      # github.workspace is the host path in container jobs; use the
      # container's own GITHUB_WORKSPACE inside run steps instead.
      PC_DEPS: ""
    steps:
      - name: Install toolchain and Wine
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 wine wine64
          # lane AVIFJXL: bundled libaom (NASM SIMD, Perl scripts)
          apt-get install -y --no-install-recommends nasm perl
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .deps-cache
          key: deps-${{ hashFiles('cmake/*.cmake') }}
          restore-keys: deps-
      # The container runs as root but the checkout belongs to the runner
      # user, and Wine refuses to create a prefix inside a directory that
      # another user owns. Keep the prefix in /tmp and boot it once here, so
      # the first test does not pay for (or time out on) prefix creation.
      - name: Create the Wine prefix
        run: |
          WINEPREFIX=/tmp/pc-wine WINEDEBUG=-all WINEDLLOVERRIDES="mscoree,mshtml=" \
            env -u DISPLAY -u WAYLAND_DISPLAY wineboot -i
          WINEPREFIX=/tmp/pc-wine wineserver -w
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake
          -DPC_VENDOR_SDL=ON -DPC_DOWNLOAD_CACHE="$GITHUB_WORKSPACE/.deps-cache"
          -DPC_WINEPREFIX=/tmp/pc-wine -DPC_WITH_AVIF=BUNDLED -DPC_WITH_JXL=BUNDLED
      - name: Build
        run: cmake --build build
      - name: Test under Wine
        run: ctest --test-dir build --timeout 600
      # The build machine's libavif and libjxl (Debian packages, pkg-config)
      # must never reach a cross build: AUTO reports both formats disabled
      # and pc_codec still compiles (no -isystem /usr/include).
      - name: Cross AUTO ignores the build machine's AVIF and JPEG XL
        run: |
          apt-get install -y --no-install-recommends pkg-config libavif-dev libjxl-dev
          pkg-config --modversion libavif libjxl
          cmake -S . -B build-auto -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake -DPC_HEADLESS=ON \
            -DPC_DOWNLOAD_CACHE="$GITHUB_WORKSPACE/.deps-cache" -DPC_WINEPREFIX=/tmp/pc-wine \
            -DPC_WITH_AVIF=AUTO -DPC_WITH_JXL=AUTO | tee auto.log
          grep -q "AVIF (PC_WITH_AVIF=AUTO): disabled" auto.log
          grep -q "JPEG XL (PC_WITH_JXL=AUTO): disabled" auto.log
          cmake --build build-auto --target pc_codec

  windows:
    name: windows-${{ matrix.cc }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [cl, clang-cl]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: NASM for the bundled libaom (lane AVIFJXL)
        shell: pwsh
        run: |
          choco install nasm -y --no-progress | Out-Null
          Add-Content $env:GITHUB_PATH "$env:ProgramFiles\NASM"
      - uses: actions/cache@v4
        with:
          path: .deps-cache
          key: deps-${{ hashFiles('cmake/*.cmake') }}
          restore-keys: deps-
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cc }}
          -DPC_VENDOR_SDL=ON -DPC_DOWNLOAD_CACHE="$env:PC_DEPS"
          -DPC_WITH_AVIF=${{ matrix.cc == 'cl' && 'BUNDLED' || 'AUTO' }}
          -DPC_WITH_JXL=${{ matrix.cc == 'cl' && 'BUNDLED' || 'AUTO' }}
      - name: Build
        # -k 0: report every failing file in one run (still fails the job)
        run: cmake --build build -- -k 0
      - name: Test
        run: ctest --test-dir build --timeout 600
      - name: Upload paintc
        if: hashFiles('src/app/CMakeLists.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: paintc-windows-${{ matrix.cc }}
          path: |
            build/paintc.exe
            build/**/paintc.exe
          if-no-files-found: warn
      - name: Package (portable zip, installer)
        if: matrix.cc == 'cl'
        shell: pwsh
        run: |
          $v = (Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_PROJECT_VERSION:STATIC=(.*)$').Matches[0].Groups[1].Value
          $name = "paintc-$v-windows-x64"
          cmake --install build --prefix "stage/$name" --component paintc
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name-portable.zip"
          $nsis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $nsis) {
            $cand = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (-not (Test-Path $cand)) { choco install nsis -y --no-progress | Out-Null }
            $nsis = $cand
          } else { $nsis = $nsis.Source }
          & $nsis /V2 "/DVERSION=$v" "/DSTAGE=$PWD\stage\$name" "/DOUTFILE=$PWD\dist\$name-setup.exe" packaging\windows\paintc.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload packages
        if: matrix.cc == 'cl'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  macos:
    name: ${{ matrix.os }}
    # macOS runners bill 10x on private repos: run on manual dispatch, tags
    # and pushes whose commit message contains [mac].
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[mac]')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14: Apple Silicon (arm64). macos-15-intel: the x86_64 image
        # (macos-13 was retired in 2025).
        os: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja (and NASM for the bundled libaom, lane AVIFJXL)
        run: brew install ninja nasm || true
      # Except on tags (release packages: BUNDLED, self-contained .dmg),
      # macos-14 tests the system-library path with Homebrew's libavif and
      # jpeg-xl (arm64 bottles; never a source build) and macos-15-intel
      # takes what its image has; both configure AUTO.
      - name: AVIF and JPEG XL from Homebrew (macos-14, not on tags)
        if: matrix.os == 'macos-14' && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        timeout-minutes: 6
        run: brew install --force-bottle pkgconf libavif jpeg-xl
      - uses: actions/cache@v4
        with:
          path: .deps-cache
          key: deps-${{ hashFiles('cmake/*.cmake') }}
          restore-keys: deps-
      # CMAKE_OSX_SYSROOT=macosx: CMake 4 no longer passes an SDK to the
      # compiler, and Apple clang without one adds -I/usr/local/include,
      # which is searched before every -isystem directory. On the Intel image
      # Homebrew's jpeg-turbo (JPEG_LIB_VERSION 80), little-cms2 and webp
      # headers there then shadow the vendored ones (docs/BUILDING.md).
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DPC_VENDOR_SDL=ON -DPC_DOWNLOAD_CACHE="$PC_DEPS"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_OSX_SYSROOT=macosx
          -DPC_WITH_AVIF=${{ startsWith(github.ref, 'refs/tags/') && 'BUNDLED' || 'AUTO' }}
          -DPC_WITH_JXL=${{ startsWith(github.ref, 'refs/tags/') && 'BUNDLED' || 'AUTO' }}
      - name: Build
        run: cmake --build build -- -k 0
      - name: Test
        run: ctest --test-dir build --timeout 600
      - name: Upload paintc
        if: hashFiles('src/app/CMakeLists.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: paintc-${{ matrix.os }}
          path: |
            build/paintc
            build/**/paintc
            build/**/paint.c.app
          if-no-files-found: warn
      - name: Package (dmg)
        run: packaging/macos/make-dmg.sh build dist
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os }}
          path: dist/*.dmg
          if-no-files-found: error
